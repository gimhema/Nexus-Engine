[package]
name         = "worldcanvas"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.95"
license      = "MIT"
description  = "WorldEditor 용 픽셀 스프라이트 저작 도구 — 텍스트 원본(.canvas)에서 시트 PNG 와 정의(.sheet.ron)를 만든다"

[[bin]]
name = "worldcanvas"
path = "src/main.rs"

[[bin]]
name              = "worldcanvas-view"
path              = "src/view/main.rs"
required-features = ["view"]

[features]
default = ["view"]
# 뷰어(GUI). CLI 만 쓸 때는 --no-default-features 로 빌드 시간을 줄인다.
view = ["dep:eframe"]

[dependencies]
png = "0.18"
# WorldEditor 와 같은 egui 0.36 + wgpu 계열.
eframe = { version = "0.36", optional = true, default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }

# WorldEditor 와 같은 린트. clippy 는 -D warnings 로 돌린다.
[lints.rust]
unsafe_code                   = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

# 고해상도(32px/m) 시트는 그림이 커서 디버그 빌드의 결과물 동기화 검사가 느리다(78초) —
# 이 크레이트와 PNG 쪽만 최적화해 컴파일한다. 뷰어 의존성(eframe·wgpu)은 그대로라 컴파일 시간은 거의 같다.
[profile.dev.package.worldcanvas]
opt-level = 2

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.fdeflate]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2

[profile.dev.package.flate2]
opt-level = 2

[profile.dev.package.crc32fast]
opt-level = 2

[profile.dev.package.simd-adler32]
opt-level = 2
