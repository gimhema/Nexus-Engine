[workspace]
resolver = "3"
members = [
    "crates/nexus-assets",
    "crates/nexus-core",
    "crates/nexus-platform",
    "crates/nexus-render",
    "crates/nexus-render-wgpu",
    "crates/nexus-sim",
    "apps/world-editor",
]

[workspace.package]
edition      = "2024"
version      = "0.1.0"
license      = "MIT"
rust-version = "1.95"

[workspace.dependencies]
# ── 내부 크레이트 ────────────────────────────────────────────────────────────
nexus-assets     = { path = "crates/nexus-assets" }
nexus-core       = { path = "crates/nexus-core" }
nexus-platform   = { path = "crates/nexus-platform" }
nexus-render     = { path = "crates/nexus-render" }
nexus-render-wgpu = { path = "crates/nexus-render-wgpu" }
nexus-sim        = { path = "crates/nexus-sim" }

# ── 외부 의존 ────────────────────────────────────────────────────────────────
# egui / egui-wgpu / egui-winit 은 반드시 같은 마이너 버전이어야 한다.
glam              = "0.33"
winit             = "0.30"
raw-window-handle = "0.6"
wgpu              = "30.0"
pollster          = "1.0"
bytemuck          = { version = "1.25", features = ["derive"] }
egui              = "0.36"
egui-wgpu         = "0.36"
egui-winit        = "0.36"
png               = "0.18"
# 존 파일 (S7-2). 앱만 쓴다 — 코어·시뮬레이션 크레이트는 직렬화를 모른다.
serde             = { version = "1.0", features = ["derive"] }
ron               = "0.12"

# 워크스페이스 공통 린트. 크레이트별 개별 설정은 두지 않는다.
# CI 가 clippy 를 -D warnings 로 돌리므로 warn 도 사실상 오류다.
[workspace.lints.rust]
unsafe_code                   = "deny"   # 각 크레이트는 lib.rs 에서 forbid 로 한 번 더 막는다
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all                        = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"      # unsafe 가 생기면 SAFETY: 주석 필수
